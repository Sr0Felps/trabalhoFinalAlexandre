spring.application.name=TrabalhoFinal

# Porta da aplicação
server.port=8080

# Configurações do Banco de Dados (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/adega_db?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do JPA/Hibernate
# 'update' cria as tabelas automaticamente baseado nas nossas classes Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true